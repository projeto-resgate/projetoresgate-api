name: Deploy - Projeto Resgate API

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag ou SHA a ser deployado'
        required: false
        default: 'main'

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ vars.DOCKER_IMAGE_REPO }}

jobs:
  resolve:
    name: Resolver a versão (ref -> SHA)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Resolver SHA
        id: sha
        env:
          REF: ${{ inputs.ref }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=prod-${SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Versão a publicar: $REF -> $SHA"

  ci:
    name: CI (build, testes e Sonar)
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  build-and-push:
    name: Build e push da imagem (Docker Hub)
    needs: [ resolve, ci ]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Login no Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ needs.resolve.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Limpar tags antigas no Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.resolve.outputs.tag }}
          KEEP_PREVIOUS: "1"
        run: |
          set -uo pipefail
          warn() { echo "::warning title=Limpeza do Docker Hub::$1"; exit 0; }
          API="https://hub.docker.com/v2"
          NAMESPACE="${IMAGE_REPO%%/*}"
          REPOSITORY="${IMAGE_REPO#*/}"

          TOKEN=$(curl -sf -X POST "$API/auth/token" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg id "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" '{identifier: $id, secret: $secret}')" \
            | jq -r '.access_token // empty')
          [ -n "${TOKEN:-}" ] || warn "Não foi possível autenticar na API do Docker Hub. Nenhuma tag foi removida."

          URL="$API/namespaces/$NAMESPACE/repositories/$REPOSITORY/tags?page_size=100"
          TAGS=""
          while [ -n "$URL" ]; do
            PAGE=$(curl -sf "$URL" -H "Authorization: Bearer $TOKEN") || warn "Não foi possível listar as tags. Nenhuma tag foi removida."
            TAGS+=$(echo "$PAGE" | jq -r '.results[] | select(.name | startswith("prod-")) | "\(.tag_last_pushed) \(.name)"')$'\n'
            URL=$(echo "$PAGE" | jq -r '.next // empty')
          done

          OLD=$(printf '%s' "$TAGS" | grep -v '^$' | sort -r | awk '{print $2}' | grep -vxF "$CURRENT_TAG" | tail -n +"$((KEEP_PREVIOUS + 1))")
          echo "Mantidas: $CURRENT_TAG, latest e as $KEEP_PREVIOUS tag(s) prod- anteriores mais recentes."
          [ -n "$OLD" ] || { echo "Nenhuma tag antiga para remover."; exit 0; }

          for TAG in $OLD; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              "$API/namespaces/$NAMESPACE/repositories/$REPOSITORY/tags/$TAG" -H "Authorization: Bearer $TOKEN")
            case "$CODE" in
              2*) echo "Removida: $TAG" ;;
              *) echo "::warning title=Limpeza do Docker Hub::Falha ao remover $TAG (HTTP $CODE). O DOCKERHUB_TOKEN precisa da permissão Read, Write, Delete." ;;
            esac
          done
