version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: [ dependencies, java ]
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-minor-patch:
        update-types: [ minor, patch ]
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [ dependencies, ci ]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [ dependencies, docker ]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directories: [ "/", "/deploy" ]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels: [ dependencies, docker ]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "postgres"
        update-types: [ "version-update:semver-major" ]
