spring.application.name=projetoresgate-api
spring.datasource.url=jdbc:postgresql://localhost:5432/projetoresgatedb
spring.datasource.username=admin
spring.datasource.password=admin
api.security.token.secret=development
cors.allowed-origins=http://localhost:*
api.cookie.secure=false
api.cookie.same-site=Lax
spring.jpa.hibernate.ddl-auto=validate
spring.messages.encoding=UTF-8
api.rate-limit.max-requests=20
api.rate-limit.window-seconds=60
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
server.error.include-stacktrace=never
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true