spring.application.name=projetoresgate-api
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
api.security.token.secret=${API_SECURITY_TOKEN_SECRET}
api.security.access-token.duration=${API_SECURITY_ACCESS_TOKEN_DURATION:900}
api.security.refresh-token.duration=${API_SECURITY_REFRESH_TOKEN_DURATION:604800}
api.security.refresh-token.cleanup.enabled=${API_SECURITY_REFRESH_TOKEN_CLEANUP_ENABLED:true}
api.security.refresh-token.cleanup.rate=${API_SECURITY_REFRESH_TOKEN_CLEANUP_RATE:3600000}
api.cookie.secure=${API_COOKIE_SECURE:true}
api.cookie.same-site=${API_COOKIE_SAME_SITE:Strict}
cors.allowed-origins=${CORS-ALLOWED-ORIGINS}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.messages.encoding=UTF-8
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
server.error.include-stacktrace=never
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
